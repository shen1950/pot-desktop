name: 问题反馈 / Bug report
description: 反馈 pot-guling 的问题
title: '[Bug] '
body:
    - type: markdown
      attributes:
          value: |
              这里是 pot-guling（Pot 派生版）的反馈入口。请先查看 README 并搜索已有问题。
              请勿粘贴 API Key、访问令牌或私人翻译内容。
    - type: input
      id: version
      attributes:
          label: pot-guling 版本或源码提交
          placeholder: '例如 v1.4.7，或 master 的提交号'
      validations:
          required: true
    - type: input
      id: system
      attributes:
          label: 操作系统与架构
          placeholder: Windows 11 x64
      validations:
          required: true
    - type: textarea
      id: reproduction
      attributes:
          label: 复现步骤、预期结果与实际结果
      validations:
          required: true
    - type: textarea
      id: logs
      attributes:
          label: 日志与截图
          description: 在「关于应用 → 查看日志」中获取，提交前请移除敏感信息。
