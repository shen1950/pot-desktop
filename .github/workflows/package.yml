name: Build pot-guling (Windows x64)

on:
    workflow_dispatch:

permissions:
    contents: read

jobs:
    windows:
        runs-on: windows-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version-file: .node-version
            - uses: pnpm/action-setup@v4
              with:
                  version: 11.20.0
            - uses: dtolnay/rust-toolchain@stable
            - name: Verify project metadata
              run: node .scripts/check-project.mjs
            - name: Install frontend dependencies
              run: pnpm install --frozen-lockfile
            - name: Build frontend
              run: pnpm build
            - name: Test Rust backend
              run: cargo test --manifest-path src-tauri/Cargo.toml --locked --bin pot
            - name: Build Windows installer
              run: pnpm tauri build --bundles nsis -- --locked
            - name: Calculate SHA-256
              shell: pwsh
              run: |
                  $installers = @(Get-ChildItem -LiteralPath src-tauri/target/release/bundle/nsis -Filter 'pot-guling_*-setup.exe')
                  if ($installers.Count -eq 0) { throw 'No pot-guling installer produced' }
                  $lines = $installers | ForEach-Object {
                      $hash = (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
                      "$hash  $($_.Name)"
                  }
                  $lines | Set-Content -LiteralPath src-tauri/target/release/bundle/nsis/SHA256SUMS.txt -Encoding utf8
            - uses: actions/upload-artifact@v4
              with:
                  name: pot-guling-windows-x64-${{ github.sha }}
                  path: |
                      src-tauri/target/release/bundle/nsis/pot-guling_*-setup.exe
                      src-tauri/target/release/bundle/nsis/SHA256SUMS.txt
                  if-no-files-found: error
